<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order placed — Bazaro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <section class="section">
    <div class="wrap" style="max-width:560px;">
      <div class="summary-card" id="success-root">
        <div class="skel" style="height:180px"></div>
      </div>
    </div>
  </section>
</main>
<div id="app-footer"></div>
<div id="toast-host"></div>
<script type="module">
  import { mountHeader, mountFooter } from "./js/layout.js";
  import { db, doc, getDoc } from "./js/firebase.js";
  import { bdt, escapeHtml } from "./js/utils.js";

  mountHeader();
  mountFooter();

  const id = new URLSearchParams(location.search).get("id");
  const root = document.getElementById("success-root");

  async function init() {
    if (!id) { root.innerHTML = `<p>Order not found.</p>`; return; }
    let data;
    try {
      const snap = await getDoc(doc(db, "orders", id));
      if (!snap.exists()) throw new Error();
      data = snap.data();
    } catch (e) {
      const cached = sessionStorage.getItem("lastOrder");
      if (cached) data = JSON.parse(cached);
      else { root.innerHTML = `<p>We couldn't load this order.</p>`; return; }
    }
    root.innerHTML = `
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:2.2rem;">✓</div>
        <h1 style="font-size:1.4rem;">Order placed successfully</h1>
        <p class="muted">Thanks, ${escapeHtml(data.customerName || "")} — we'll deliver by cash on receipt.</p>
      </div>
      <div class="summary-row"><span>Order ID</span><span>${id}</span></div>
      <div class="summary-row"><span>Total</span><span>${bdt(data.total)}</span></div>
      <div class="summary-row"><span>Payment method</span><span>${escapeHtml(data.paymentMethod)}</span></div>
      <div class="summary-row"><span>Delivery to</span><span>${escapeHtml(data.area)}, ${escapeHtml(data.district)}</span></div>
      <div class="summary-row"><span>Status</span><span class="status-badge status-pending">Pending</span></div>
      <div style="display:flex;gap:10px;margin-top:18px;">
        <a class="btn btn-outline btn-block" href="account.html">View my orders</a>
        <a class="btn btn-primary btn-block" href="products.html">Continue shopping</a>
      </div>
    `;
  }
  init();
</script>
</body>
</html>
