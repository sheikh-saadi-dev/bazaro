<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Change Password — Bazaro Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell" id="admin-shell">
  <div class="admin-main" style="max-width:420px;">
    <h1 style="font-size:1.4rem;">Change password</h1>
    <form id="pw-form">
      <div class="field"><label>Current password</label><input id="pw-current" type="password" required></div>
      <div class="field" style="margin-top:10px;"><label>New password</label><input id="pw-new" type="password" required minlength="6"></div>
      <div class="field" style="margin-top:10px;"><label>Confirm new password</label><input id="pw-confirm" type="password" required minlength="6"></div>
      <div class="field-error" id="pw-error" style="margin-top:6px;"></div>
      <button class="btn btn-primary" style="margin-top:14px;" type="submit">Update password</button>
    </form>
  </div>
</div>
<div id="toast-host"></div>
<script type="module">
  import { requireAdmin } from "./js/admin-auth.js";
  import { mountAdminLayout } from "./js/admin-layout.js";
  import { auth, EmailAuthProvider, reauthenticateWithCredential, updatePassword } from "../js/firebase.js";
  import { friendlyAuthError } from "../js/auth.js";
  import { toast } from "../js/utils.js";

  const { user } = await requireAdmin();
  mountAdminLayout("change-password.html");

  document.getElementById("pw-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = document.getElementById("pw-error");
    err.textContent = "";
    const current = document.getElementById("pw-current").value;
    const next = document.getElementById("pw-new").value;
    const confirm = document.getElementById("pw-confirm").value;
    if (next !== confirm) { err.textContent = "New passwords don't match."; return; }
    try {
      const cred = EmailAuthProvider.credential(user.email, current);
      await reauthenticateWithCredential(user, cred);
      await updatePassword(user, next);
      toast("Password updated.");
      document.getElementById("pw-form").reset();
    } catch (e2) {
      err.textContent = friendlyAuthError(e2.code) || "Couldn't update password.";
    }
  });
</script>
</body>
</html>
