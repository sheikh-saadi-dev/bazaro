<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title id="page-title">Add Product — Bazaro Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<style>
  .pf-grid { display: grid; grid-template-columns: 1fr 300px; gap: 24px; align-items: start; max-width: 900px; }
  @media (max-width: 800px) { .pf-grid { grid-template-columns: 1fr; } }
  .variant-row { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  .img-preview-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .img-preview-row img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
</style>
</head>
<body>
<div class="admin-shell" id="admin-shell">
  <div class="admin-main">
    <h1 id="form-heading" style="font-size:1.4rem;">Add product</h1>
    <form id="product-form" class="pf-grid" novalidate>
      <div>
        <div class="field"><label>Product name</label><input id="p-name" required></div>
        <div class="field" style="margin-top:10px;"><label>Description</label><textarea id="p-desc" rows="4"></textarea></div>
        <div class="form-grid" style="margin-top:10px;">
          <div class="field"><label>Category</label><select id="p-category" required></select></div>
          <div class="field"><label>Stock quantity</label><input id="p-stock" type="number" min="0" required></div>
          <div class="field"><label>Price (৳)</label><input id="p-price" type="number" min="0" step="0.01" required></div>
          <div class="field"><label>Discount price (৳, optional)</label><input id="p-discount" type="number" min="0" step="0.01"></div>
        </div>

        <h3 style="font-size:1rem;margin-top:20px;">Images</h3>
        <div class="field"><label>Image URL</label><input id="p-image-url" placeholder="https://…"></div>
        <div class="field" style="margin-top:8px;"><label>Or upload an image</label><input id="p-image-file" type="file" accept="image/*"></div>
        <div class="img-preview-row" id="img-preview"></div>

        <h3 style="font-size:1rem;margin-top:20px;">Variants (optional)</h3>
        <div id="variants-host"></div>
        <button type="button" class="btn btn-outline btn-sm" id="add-variant-btn">+ Add variant group</button>
      </div>

      <div class="summary-card">
        <label class="pill-toggle" style="margin-bottom:10px;"><input type="checkbox" id="p-top-product"> Top Product</label><br>
        <label class="pill-toggle" style="margin-bottom:10px;"><input type="checkbox" id="p-top-sale"> Top Sale</label><br>
        <div class="field"><label>Status</label>
          <select id="p-status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:14px;">Save product</button>
        <a href="products.html" class="btn btn-outline btn-block" style="margin-top:8px;">Cancel</a>
      </div>
    </form>
  </div>
</div>
<div id="toast-host"></div>
<script type="module" src="js/admin-product-form.js"></script>
</body>
</html>
