<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Payment Methods — Bazaro Admin</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell" id="admin-shell">
  <div class="admin-main">
    <h1 style="font-size:1.4rem;">Payment Methods</h1>
    <p class="muted">Cash on Delivery is enabled by default. Add more methods (bKash, Nagad, etc.) as you integrate them.</p>
    <div id="crud-root"></div>
  </div>
</div>
<div id="toast-host"></div>
<script type="module">
  import { requireAdmin } from "./js/admin-auth.js";
  import { mountAdminLayout } from "./js/admin-layout.js";
  import { mountCrudPage } from "./js/admin-crud.js";

  await requireAdmin();
  mountAdminLayout("payment-methods.html");

  mountCrudPage({
    collectionName: "paymentMethods",
    title: "Payment method",
    addLabel: "Add payment method",
    emptyMessage: "No payment methods configured.",
    columns: [
      { key: "name", label: "Name" },
      { key: "active", label: "Status", render: (i) => i.active ? "Enabled" : "Disabled" },
    ],
    fields: [
      { key: "name", label: "Method name (e.g. bKash)", required: true },
      { key: "instructions", label: "Instructions shown at checkout (optional)", type: "textarea" },
      { key: "active", label: "Enabled", type: "toggle", default: true },
    ]
  });
</script>
</body>
</html>
