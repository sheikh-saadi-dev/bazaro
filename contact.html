<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<title>Contact — Bazaro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main><section class="section"><div class="wrap" style="max-width:480px;">
  <h1 class="display" style="font-size:1.7rem">Contact us</h1>
  <p id="contact-details" class="muted">Loading contact details…</p>
</div></section></main>
<div id="app-footer"></div>
<script type="module">
  import { mountHeader, mountFooter } from "./js/layout.js";
  import { db, doc, getDoc } from "./js/firebase.js";
  mountHeader(); mountFooter();
  (async () => {
    const el = document.getElementById("contact-details");
    try {
      const snap = await getDoc(doc(db, "settings", "store"));
      const s = snap.exists() ? snap.data() : {};
      el.innerHTML = `Phone: ${s.phone || "—"}<br>Email: ${s.email || "—"}<br>Address: ${s.address || "—"}`;
    } catch (e) { el.textContent = "Couldn't load contact details right now."; }
  })();
</script>
</body>
</html>
