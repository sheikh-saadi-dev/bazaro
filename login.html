<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Bazaro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app-header"></div>
<main>
  <div class="auth-shell" id="auth-shell">
    <h1>Welcome back</h1>
    <p class="muted">Log in to view your orders and wishlist.</p>

    <button class="btn btn-google btn-block" id="google-login-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.03l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.97l2.99 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>
    <div class="auth-divider">or</div>

    <form id="login-form" novalidate>
      <div class="field"><label for="email">Email</label><input id="email" type="email" required></div>
      <div class="field" style="margin-top:10px;"><label for="password">Password</label><input id="password" type="password" required></div>
      <div class="field-error" id="form-error" style="margin-top:6px;"></div>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" type="submit">Log in</button>
      <button class="btn btn-ghost btn-block" type="button" id="forgot-btn" style="margin-top:6px;font-size:.82rem;">Forgot password?</button>
    </form>
    <div class="auth-switch">Don't have an account? <a href="register.html">Sign up</a></div>
  </div>
</main>
<div id="app-footer"></div>
<div id="toast-host"></div>
<script type="module">
  import { mountHeader, mountFooter } from "./js/layout.js";
  import { loginUser, loginWithGoogle, resetPassword, friendlyAuthError, resendVerificationEmail, checkEmailVerified, logoutUser } from "./js/auth.js";
  import { toast } from "./js/utils.js";
  mountHeader(); mountFooter();

  const params = new URLSearchParams(location.search);
  const shell = document.getElementById("auth-shell");

  function showVerifyScreen() {
    shell.innerHTML = `
      <div class="verify-icon">📧</div>
      <h1 style="text-align:center;">Verify your email</h1>
      <p class="muted" style="text-align:center;">We've sent a verification link to your email. Click it, then come back here.</p>
      <button class="btn btn-primary btn-block" id="verify-continue-btn">I've verified — Continue</button>
      <button class="btn btn-ghost btn-block" id="verify-resend-btn" style="margin-top:8px;font-size:.82rem;">Resend email</button>
      <button class="btn btn-ghost btn-block" id="verify-logout-btn" style="margin-top:4px;font-size:.82rem;color:var(--danger);">Use a different account</button>
      <p class="field-error" id="verify-error" style="text-align:center;margin-top:6px;"></p>
    `;
    document.getElementById("verify-continue-btn").addEventListener("click", async () => {
      const ok = await checkEmailVerified();
      if (ok) window.location.href = params.get("next") || "account.html";
      else document.getElementById("verify-error").textContent = "Still not verified — check your inbox (and spam folder).";
    });
    document.getElementById("verify-resend-btn").addEventListener("click", async () => {
      await resendVerificationEmail();
      toast("Verification email sent again.");
    });
    document.getElementById("verify-logout-btn").addEventListener("click", async () => {
      await logoutUser();
      window.location.reload();
    });
  }

  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const err = document.getElementById("form-error");
    err.textContent = "";
    try {
      const cred = await loginUser(email, password);
      if (!cred.user.emailVerified) { showVerifyScreen(); return; }
      toast("Logged in.");
      window.location.href = params.get("next") || "account.html";
    } catch (e2) {
      err.textContent = friendlyAuthError(e2.code);
    }
  });

  document.getElementById("google-login-btn").addEventListener("click", async () => {
    try {
      await loginWithGoogle();
      toast("Logged in.");
      window.location.href = params.get("next") || "account.html";
    } catch (e2) {
      document.getElementById("form-error").textContent = friendlyAuthError(e2.code);
    }
  });

  document.getElementById("forgot-btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) { document.getElementById("form-error").textContent = "Enter your email above first."; return; }
    try { await resetPassword(email); toast("Password reset email sent."); }
    catch (e) { document.getElementById("form-error").textContent = friendlyAuthError(e.code); }
  });
</script>
</body>
</html>
